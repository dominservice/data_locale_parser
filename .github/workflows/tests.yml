name: tests

on:
  push:
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            laravel: '^9.52'
            testbench: '^7.29'
            phpunit: '^9.6'
          - php: '8.1'
            laravel: '^10.48'
            testbench: '^8.0'
            phpunit: '^10.5'
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
            phpunit: '^11.0'
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, intl, mbstring, xmlwriter
          coverage: none

      - name: Select compatibility versions
        run: |
          composer config audit.block-insecure false
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate package metadata
        run: composer validate --no-check-publish --no-interaction

      - name: Validate compiled locale data
        run: composer data:validate

      - name: Run compatibility suite
        run: composer test
